<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      padding: 20px;
      margin: 0;
      background-color: #ffffff;
      color: #333;
    }

    h2 {
      font-size: 18px;
      margin-top: 0;
      color: #e60023;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .option-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 8px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }

    input[type="checkbox"] {
      accent-color: #e60023;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .divider {
      height: 1px;
      background: #ddd;
      margin: 2px 0;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 25px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    #downloadBtn {
      background-color: #e60023;
      color: white;
    }

    #downloadBtn:hover {
      background-color: #ad081b;
    }

    #stopBtn {
      background-color: #efefef;
      color: #333;
    }

    #stopBtn:hover {
      background-color: #e2e2e2;
    }

    .footer {
      font-size: 10px;
      color: #8e8e8e;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h2>📌 Pin Sniper v2.0</h2>

  <div class="container">
    <div class="option-group">
      <label class="checkbox-wrapper">
        <input type="checkbox" id="continueCheck"> 
        Continue past "More Ideas"
      </label>
      <label class="checkbox-wrapper">
        <input type="checkbox" id="adsCheck"> 
        Include Promoted Pins
      </label>
      
      <div class="divider"></div>
      
      <label class="checkbox-wrapper">
        <input type="checkbox" id="highQualityCheck" checked> 
        💎 Max Quality (High-Res, Slower)
      </label>
      <label class="checkbox-wrapper">
        <input type="checkbox" id="fastModeCheck"> 
        ⚡ Fast Mode (Med-Res, Speedy)
      </label>

      <div class="divider"></div>

      <label class="checkbox-wrapper">
        <input type="checkbox" id="videoGifOnlyCheck"> 
        🎬 Video/GIF Only Mode
      </label>
    </div>

    <div class="button-group">
      <button id="downloadBtn">Start Harvesting</button>
      <button id="stopBtn">Emergency Stop</button>
    </div>
  </div>

  <div class="footer">The tripwire is set. Ready when you are.</div>

  <script src="popup.js"></script>
</body>
</html>
